<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>K12 统一原型工作台外壳模板</title>
<style>
:root{--ink:#172033;--muted:#738197;--line:#dde7f2;--canvas:#f2f6fb;--top:#172337;--left:#f8fbff;--right:#fffdf0;--blue:#2675ed;--blue-deep:#1554c3;--blue-soft:#eaf3ff;--yellow:#fff8cf;--yellow-line:#e3c94f;--radius:8px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}*{box-sizing:border-box}html,body{min-height:100%;margin:0;color:var(--ink);background:var(--canvas);font-size:14px;line-height:1.5}button{font:inherit;cursor:pointer}.prototype{min-height:100vh;display:grid;grid-template-rows:64px 1fr}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 24px;background:var(--top);color:#fff}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand-mark{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:#2675ed;color:#fff;font-weight:800}.brand-copy{min-width:0}.brand-title{font-size:16px;font-weight:800;white-space:nowrap}.brand-sub{margin-left:8px;color:#aebbd0;font-size:12px;white-space:nowrap}.user{display:flex;align-items:center;gap:10px;color:#cbd5e1;white-space:nowrap}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#d9e8ff;color:#2362c8;font-weight:800}.shell{display:grid;grid-template-columns:238px minmax(680px,1fr) 310px;min-height:calc(100vh - 64px)}.sidebar{overflow:auto;padding:18px 14px;background:var(--left);border-right:1px solid var(--line)}.side-heading{padding:4px 9px 16px;border-bottom:1px solid var(--line)}.side-title{font-weight:800}.side-note{margin-top:5px;color:var(--muted);font-size:12px}.nav-group{margin-top:18px}.nav-label{padding:0 9px 7px;color:#8c9aaf;font-size:11px;font-weight:800;letter-spacing:.04em}.nav-item{width:100%;border:0;border-radius:8px;background:transparent;color:#4f6077;padding:10px 11px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px}.nav-item:hover{background:#eef5ff;color:var(--blue)}.nav-item.active{background:var(--blue-soft);color:var(--blue-deep);font-weight:800}.nav-item small{color:#9ba8ba;font-size:11px}.nav-item.active small{color:var(--blue)}.nav-child{margin:2px 0 4px 20px;border-left:1px dashed #cbd8e7;padding-left:8px}.nav-child .nav-item{padding:8px 9px;font-size:12px}.nav-child[hidden]{display:none}.main{min-width:0;overflow:auto;padding:22px;background:var(--canvas)}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:16px}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.08em}.page-title{margin:4px 0 0;font-size:24px;line-height:1.25}.page-sub{margin:7px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:36px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);padding:8px 12px;font-weight:700}.btn:hover{border-color:#9cbbe8;background:#f9fcff}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.workspace{display:grid;gap:16px}.placeholder{min-height:460px;border:1px dashed #b9cbe1;border-radius:8px;background:#f8fbff;display:grid;place-items:center;color:#8090a6}.notes{overflow:auto;padding:22px 14px;border-left:1px solid var(--line);background:var(--right)}.notes-title{font-size:14px;font-weight:800}.notes-sub{margin-top:5px;color:#8c7c3f;font-size:12px}.note{margin-top:13px;padding:11px 12px;border:1px solid var(--yellow-line);border-radius:8px;background:var(--yellow);color:#594d1c;font-size:12px;line-height:1.55}.note b{display:block;margin-bottom:4px;color:#42370c}.focus{outline:3px solid #bfdbfe;outline-offset:2px}@media(max-width:1180px){.shell{grid-template-columns:210px minmax(630px,1fr)}.notes{display:none}}@media(max-width:860px){.prototype{grid-template-rows:58px}.topbar{padding:0 12px}.brand-sub,.user{display:none}.shell{display:block;min-height:calc(100vh - 58px)}.sidebar,.notes{display:none}.main{padding:15px}.page-head{display:block}.actions{margin-top:14px}}
</style>
</head>
<body>
<div class="prototype">
<header class="topbar"><div class="brand"><span class="brand-mark">优</span><div class="brand-copy"><span class="brand-title" id="brandTitle">K12 原型工作台</span><span class="brand-sub" id="brandSub">统一外壳模板</span></div></div><div class="user"><span id="userName">管理员</span><span class="avatar" id="userAvatar">管</span></div></header>
<div class="shell"><aside class="sidebar" aria-label="原型页面导航"><div class="side-heading"><div class="side-title" id="sideTitle">页面导航</div><div class="side-note" id="sideNote">当前原型页面入口</div></div><nav id="navRoot"></nav></aside>
<main class="main"><div class="page-head"><div><div class="eyebrow" id="pageEyebrow">PROTOTYPE WORKSPACE</div><h1 class="page-title" id="pageTitle">首页配置工作台</h1><p class="page-sub" id="pageSub">中间区域只放业务页面，不放评审说明。</p></div><div class="actions"><button class="btn" id="demoAction">演示操作</button><button class="btn primary" id="demoSave">保存</button></div></div><section class="workspace" id="workspace"><div class="placeholder" id="contentSlot">替换此区域为本轮原型的业务内容</div></section></main>
<aside class="notes" aria-label="需求说明"><div class="notes-title">需求说明</div><div class="notes-sub" id="notesSub">当前页面：首页配置工作台</div><div id="notesRoot"></div></aside></div></div>
<script>
const prototypeShell={brand:{title:'K12 原型工作台',subtitle:'统一外壳模板',user:'管理员',avatar:'管'},navigation:{title:'页面导航',subtitle:'当前原型页面入口',groups:[{label:'内容管理',items:[{id:'home',label:'首页配置工作台',badge:'主',notes:[['页面目标','展示本轮原型的业务页面和关键操作。'],['展示范围','中间区域只放业务 UI，不放评审说明。'],['导航规则','左侧导航用于页面入口和当前页定位。'],['边界说明','业务字段和流程由具体原型说明补充。']],children:[{id:'blank',label:'空白页样式',badge:'样'}]},{id:'course',label:'课程管理',badge:'3',notes:[['页面目标','管理课程列表、状态和配置入口。'],['操作结果','点击保存后更新当前页面状态。']]}]},{label:'相关维护',items:[{id:'teacher',label:'教师管理',badge:'↗',notes:[['页面目标','进入教师管理相关原型。']]}]}]},initialPage:'home'};
function renderShell(config){const c=config||prototypeShell;document.querySelector('#brandTitle').textContent=c.brand.title;document.querySelector('#brandSub').textContent=c.brand.subtitle;document.querySelector('#userName').textContent=c.brand.user;document.querySelector('#userAvatar').textContent=c.brand.avatar;document.querySelector('#sideTitle').textContent=c.navigation.title;document.querySelector('#sideNote').textContent=c.navigation.subtitle;const root=document.querySelector('#navRoot');root.innerHTML='';c.navigation.groups.forEach(group=>{const wrap=document.createElement('section');wrap.className='nav-group';const label=document.createElement('div');label.className='nav-label';label.textContent=group.label;wrap.append(label);group.items.forEach(item=>{const btn=document.createElement('button');btn.className='nav-item';btn.dataset.page=item.id;btn.innerHTML='<span>'+item.label+'</span><small>'+(item.badge||'')+'</small>';btn.addEventListener('click',()=>{if(item.children){const child=btn.nextElementSibling;child.hidden=!child.hidden;btn.classList.toggle('active',item.id===currentPage)}selectPage(item)});wrap.append(btn);if(item.children){const children=document.createElement('div');children.className='nav-child';item.children.forEach(childItem=>{const child=document.createElement('button');child.className='nav-item';child.dataset.page=childItem.id;child.innerHTML='<span>'+childItem.label+'</span><small>'+(childItem.badge||'')+'</small>';child.addEventListener('click',()=>selectPage(childItem));children.append(child)});wrap.append(children)}});root.append(wrap)});selectPage(findPage(c.initialPage)||c.navigation.groups[0].items[0])}
let currentPage='';function allItems(){return prototypeShell.navigation.groups.flatMap(group=>group.items.flatMap(item=>[item,...(item.children||[])]))}function findPage(id){return allItems().find(item=>item.id===id)}function selectPage(item){currentPage=item.id;document.querySelectorAll('.nav-item').forEach(btn=>btn.classList.toggle('active',btn.dataset.page===item.id));document.querySelector('#pageTitle').textContent=item.label;document.querySelector('#notesSub').textContent='当前页面：'+item.label;document.querySelector('#contentSlot').textContent='替换此区域为「'+item.label+'」的业务内容';const notes=document.querySelector('#notesRoot');notes.innerHTML='';(item.notes||[['页面目标','请在此补充当前页面的业务目标。']]).forEach(note=>{const card=document.createElement('div');card.className='note';card.innerHTML='<b>'+note[0]+'</b><span>'+note[1]+'</span>';notes.append(card)})}
document.querySelector('#demoAction').addEventListener('click',()=>{document.querySelector('#contentSlot').textContent='已触发中间业务区操作；左右外壳保持不变'});document.querySelector('#demoSave').addEventListener('click',()=>{document.querySelector('#contentSlot').textContent='已保存到当前原型草稿；右侧规则仍保持可见'});renderShell();
</script>
</body>
</html>
