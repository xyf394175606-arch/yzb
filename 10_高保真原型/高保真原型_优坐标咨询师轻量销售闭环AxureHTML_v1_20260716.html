    function renderPC(p){const labels={'pc-chat':'会话','pc-cases':'服务单','pc-students':'学员','pc-recommend':'推荐'};return head(`咨询师工作台 · ${labels[p]}`,'李老师 · 今日服务队列')+`<div class="tabs">${Object.entries(labels).map(([k,v])=>`<button class="tab ${k===p?'active':''}" data-go="${k}">${v}</button>`).join('')}</div><div class="filter"><input placeholder="搜索家长/学员"><select><option>全部状态</option><option>待响应</option><option>待推荐</option></select><button class="btn primary">查询</button></div>${p==='pc-chat'?`<div class="grid cols-2"><div>${conversationList()}</div><div class="panel"><div class="panel-head"><h2>王女士 / 小宇</h2><button class="btn" data-go="case-detail">服务单详情</button></div><div class="panel-body">最近消息：已为您整理了三位数学老师建议。</div></div></div>`:p==='pc-cases'?caseTable(false):p==='pc-students'?studentTable():recommendTable()}`}
    function renderOps(p){if(p==='ops-list')return head('顾问列表','配置顾问资源和服务能力','新增顾问',null,'新增顾问草稿已创建')+`<div class="filter"><input placeholder="姓名/手机号"><select><option>全部状态</option><option>正常</option><option>限制</option><option>停用</option></select><button class="btn primary">查询</button></div>${opsTable()}`;
      if(p==='ops-detail')return head('顾问详情 · 李老师','C20001 · 正常 · 12分')+`<div class="grid cols-3"><div class="metric"><b>18</b><span>绑定老师</span></div><div class="metric"><b>24</b><span>进行中服务单</span></div><div class="metric"><b>86</b><span>近90天服务学员</span></div></div><div class="entry-grid">${[['profile-review','资料审核','线上v3 / 草稿v4'],['teacher-bind','老师绑定','当前18位老师'],['contact-config','联系方式与容量','隐私号 / 容量无限'],['handoff','代接与转交','当前无代接'],['display-values','前台值与真实评价','前台4.9 / 真实4.7'],['audit','变更审计','最近7条变更']].map(x=>`<div class="entry-card"><h2>${x[1]}</h2><p>${x[2]}</p><button class="btn" data-go="${x[0]}">进入</button></div>`).join('')}</div>`;
      if(p==='profile-review')return head('资料审核','李老师 · 草稿v4','审核通过',null,'草稿v4已发布为线上版本')+`<div class="grid cols-2"><div class="panel"><div class="panel-head"><h2>线上版本 v3</h2></div><div class="panel-body">个人介绍、2条履历、3条服务案例</div></div><div class="panel"><div class="panel-head"><h2>待审版本 v4</h2></div><div class="panel-body">修改个人介绍，新增1条履历；服务案例未变。</div></div></div><button class="btn danger" data-action="已驳回并记录原因">驳回</button>`;
      if(p==='teacher-bind')return head('老师绑定','李老师 · 绑定18 / 上限无限','新增绑定',null,'老师已绑定到李老师')+`<div class="filter"><input placeholder="老师姓名"><button class="btn primary">查询</button></div><table><thead><tr><th>老师</th><th>学科</th><th>当前顾问</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td>张老师</td><td>小学数学</td><td>李老师</td><td><span class="status green">已绑定</span></td><td><button class="btn">调整</button></td></tr><tr><td>陈老师</td><td>小学数学</td><td>李老师</td><td><span class="status green">已绑定</span></td><td><button class="btn">调整</button></td></tr></tbody></table>`;
      if(p==='contact-config')return head('联系方式与容量配置','李老师 · 配置保存后立即生效','保存',null,'配置已保存并写入审计')+`<div class="panel"><div class="panel-body"><div class="form-row"><label>平台IM</label><select><option>启用</option><option>停用</option></select></div><div class="form-row"><label>企业微信</label><div>已配置 · 会话存档正常</div></div><div class="form-row"><label>电话模式</label><div><span class="status green">双向隐私号</span> <button class="btn danger" data-modal="popup-phone">切换真实电话</button></div></div><div class="form-row"><label>老师绑定容量</label><select><option>无限</option><option>自定义</option></select></div><div class="form-row"><label>服务单容量</label><select><option>无限</option><option>自定义</option></select></div></div></div>`;
      if(p==='handoff')return head('代接与转交','处理请假、限制或停用顾问','确认转交',null,'已转交2个服务单并保留负责人历史')+`<div class="panel"><div class="panel-body"><div class="form-row"><label>原负责人</label><div>李老师</div></div><div class="form-row"><label>目标顾问</label><select><option>周老师 · 可接待</option><option>王老师 · 容量已满</option></select></div><div class="form-row"><label>转交范围</label><select><option>选中的2个服务单</option><option>全部进行中服务单</option></select></div><div class="form-row"><label>转交原因 *</label><textarea>顾问请假，需临时代接</textarea></div></div></div>`;
      if(p==='display-values')return head('前台值与真实评价','李老师 · 两类数据独立维护','保存前台值',null,'前台值已更新并写入审计')+`<div class="grid cols-2"><div class="panel"><div class="panel-head"><h2>前台运营值</h2></div><div class="panel-body"><div class="form-row"><label>家长评分</label><input value="4.9"></div><div class="form-row"><label>评价人数</label><input value="128"></div><div class="form-row"><label>近90天服务学员</label><input value="86"></div><div class="form-row"><label>调整原因 *</label><textarea>季度运营校准</textarea></div></div></div><div class="panel"><div class="panel-head"><h2>真实评价（只读）</h2></div><div class="panel-body"><p>真实平均分：4.7</p><p>真实评价数：63</p><p>最近评价：讲解专业，推荐有依据。</p></div></div></div>`;
      if(p==='audit')return head('变更审计','资料、电话模式和前台值变更历史')+auditTable();
      if(['archive','calls','gap'].includes(p))return head(pageMeta[p][0],pageMeta[p][1])+retentionTable(p);
      return head('渠道证据详情','CV60001 / SC40001 · 王女士与李老师')+`<div class="grid cols-3"><div class="metric"><b>已归档</b><span>企微消息</span></div><div class="metric" style="border-color:var(--red)"><b>失败</b><span>电话录音</span></div><div class="metric" style="border-color:var(--amber)"><b>处理中</b><span>语音转写</span></div></div><div class="panel" style="margin-top:12px"><div class="panel-head"><h2>证据时间线</h2><button class="btn" data-action="已重新拉取留痕">重试</button></div><div class="panel-body"><div class="timeline"><div class="timeline-item"><b>10:20 家长发起咨询</b><span>平台IM · 已归档</span></div><div class="timeline-item"><b>10:25 顾问电话回拨</b><span>通话12分18秒 · 录音同步失败</span></div><div class="timeline-item"><b>10:42 顾问发送推荐</b><span>老师卡2张 · 课程卡1张</span></div></div></div></div>`}
    function renderRisk(p){if(p==='risk-list')return head('风险事件列表','待复核优先，自动命中不等于违规')+`<div class="filter"><select><option>待复核</option><option>补证</option><option>已确认</option></select><button class="btn primary">查询</button></div><table><thead><tr><th>事件</th><th>来源</th><th>顾问</th><th>证据</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td>RE70001</td><td>家长举报</td><td>李老师</td><td>3条</td><td><span class="status amber">待复核</span></td><td><button class="btn" data-go="risk-detail">复核</button></td></tr><tr><td>RE70002</td><td>自动分析</td><td>周老师</td><td>留痕缺口</td><td><span class="status">待补证</span></td><td><button class="btn">查看</button></td></tr></tbody></table>`;
      if(p==='risk-detail')return head('风险事件 RE70001','李老师 · 家长举报 · 当前信用12分')+`<div class="panel"><div class="panel-head"><h2>事件摘要</h2><span class="status amber">待复核</span></div><div class="panel-body"><p>举报内容：顾问对课程效果存在夸大表述。</p><p>关联：会话CV60001 · 服务单SC40001 · 电话记录CALL90001</p></div></div><div class="panel"><div class="panel-head"><h2>证据</h2><button class="btn" data-go="evidence">查看完整留痕</button></div><div class="panel-body"><div class="timeline"><div class="timeline-item"><b>平台文字消息</b><span>已归档 · 上下文完整</span></div><div class="timeline-item"><b>电话录音</b><span>12分18秒 · 转写已完成</span></div><div class="timeline-item"><b>家长补充说明</b><span>2026-07-16 11:03</span></div></div></div></div><div class="toolbar"><button class="btn">退回补证</button><button class="btn danger" data-modal="popup-deduct">确认违规并扣分</button></div>`;
      if(p==='ledger')return head('信用台账','李老师 · 当前12分')+`<table><thead><tr><th>时间</th><th>事件</th><th>类型</th><th>分值</th><th>余额</th><th>操作人</th></tr></thead><tbody><tr><td>2026-06-01</td><td>初始化</td><td>初始分</td><td>+12</td><td>12</td><td>系统</td></tr><tr><td>2026-05-10</td><td>RE60008</td><td>申诉返分</td><td>+2</td><td>12</td><td>王风控</td></tr><tr><td>2026-04-15</td><td>RE60008</td><td>扣分</td><td>-2</td><td>10</td><td>赵风控</td></tr></tbody></table>`;
      if(p==='remediation')return head('整改任务','按扣分档位管理观察期与恢复')+`<table><thead><tr><th>顾问</th><th>扣分</th><th>观察期</th><th>学习整改</th><th>新增违规</th><th>状态</th></tr></thead><tbody><tr><td>周老师</td><td>4</td><td>60天</td><td>已完成</td><td>无</td><td><span class="status green">可恢复</span></td></tr><tr><td>陈老师</td><td>12</td><td>不自动恢复</td><td>待重新认证</td><td>-</td><td><span class="status red">停用</span></td></tr></tbody></table>`;
      if(p==='appeal-list')return head('申诉列表','重复申诉独立保存')+`<table><thead><tr><th>申诉</th><th>风险事件</th><th>次数</th><th>材料</th><th>原处理人</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td>AP80002</td><td>RE70001</td><td>第2次</td><td>新增录音说明</td><td>赵风控</td><td><span class="status amber">待复核</span></td><td><button class="btn" data-go="appeal-review">处理</button></td></tr></tbody></table>`;
      return head('申诉复核 AP80002','RE70001 · 第二次申诉 · 复核人王风控')+`<div class="grid cols-2"><div class="panel"><div class="panel-head"><h2>原结论</h2></div><div class="panel-body"><p>一般业务违规，扣4分。</p><p>原处理人：赵风控</p></div></div><div class="panel"><div class="panel-head"><h2>本次新增材料</h2></div><div class="panel-body"><p>补充电话录音时间点 03:12-04:26。</p><p>提交人：李老师</p></div></div></div><div class="panel"><div class="panel-head"><h2>历史申诉</h2></div><div class="panel-body">第1次申诉：材料不足，驳回；历史内容保持不变。</div></div><button class="btn primary" data-modal="popup-appeal">提交复核结果</button>`}
    function head(title,sub,action,go,actionText){return `<div class="page-head"><div><h1>${title}</h1><p>${sub||''}</p></div>${action?`<button class="btn primary" ${go?`data-go="${go}"`:`data-action="${actionText||action+'已完成'}"`}>${action}</button>`:''}</div>`}
    function teacherCards(){return `<div class="panel"><div class="panel-head"><h2>最近推荐的老师</h2><button class="btn" data-go="popular">查看全部</button></div><div class="panel-body"><div class="card-list"><div class="item-card"><h3>张老师 · 小学数学</h3><p>结构化讲解，适合应用题提升</p><button class="btn" data-go="teacher-product">查看</button></div><div class="item-card"><h3>陈老师 · 小学数学</h3><p>耐心细致，适合基础巩固</p><button class="btn" data-go="teacher-product">查看</button></div></div></div></div>`}
    function chatView(consultant){return head(consultant?'与王女士的会话':'李老师','服务单SC40001 · 小宇 · 已推荐')+`<div class="chat"><div class="chat-context"><span>当前服务：小宇 / 数学老师推荐</span><span class="status green">已推荐</span></div><div class="messages"><div class="bubble">孩子三年级，数学应用题比较薄弱，想找一位有耐心的老师。</div><div class="bubble me">了解了，我会结合小宇的基础和学习习惯给您做一份老师建议。</div><div class="message-card"><h3>首选 · 张老师</h3><p>小学数学 · 数学思维提升课</p><p>匹配理由：结构化讲解方式适合小宇当前需求。</p><button class="btn primary" data-go="teacher-product">查看老师资料</button></div><div class="bubble">谢谢，我先看看老师资料。</div></div><div class="composer">${consultant?'<button class="btn" data-modal="popup-card">＋卡片</button>':'<button class="btn">＋</button>'}<input placeholder="输入消息"><button class="btn primary" data-action="消息已发送">发送</button></div></div>`}
    function conversationList(){return `<div class="list"><div class="list-row"><div><h3>王女士 / 小宇</h3><p>已为您整理三位老师建议</p></div><span class="badge">2</span></div><div class="list-row"><div><h3>赵先生 / 可可</h3><p>等待首次回复</p></div><span class="status red">超时</span></div></div>`}
    function caseTable(compact){return `<table><thead><tr><th>服务对象</th><th>来源</th><th>状态</th>${compact?'':'<th>最近跟进</th>'}<th>操作</th></tr></thead><tbody><tr><td>王女士 / 小宇</td><td>张老师详情</td><td><span class="status amber">待推荐</span></td>${compact?'':'<td>今天 10:32</td>'}<td><button class="btn" data-go="case-detail">查看</button></td></tr><tr><td>赵先生 / 可可</td><td>顾问分享</td><td><span class="status red">待响应</span></td>${compact?'':'<td>今天 09:10</td>'}<td><button class="btn">回复</button></td></tr></tbody></table>`}
    function studentTable(){return `<table><thead><tr><th>学员</th><th>年级</th><th>需求方向</th><th>关联服务单</th><th>操作</th></tr></thead><tbody><tr><td>小宇</td><td>三年级</td><td>数学应用题</td><td>SC40001</td><td><button class="btn" data-go="student">查看</button></td></tr><tr><td>可可</td><td>五年级</td><td>英语阅读</td><td>SC40002</td><td><button class="btn">查看</button></td></tr></tbody></table>`}
    function recommendTable(){return `<table><thead><tr><th>方案</th><th>学员</th><th>首选</th><th>版本</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td>RC50001</td><td>小宇</td><td>张老师</td><td>v2</td><td><span class="status green">已发布</span></td><td><button class="btn" data-go="recommend">查看</button></td></tr><tr><td>RC50002</td><td>可可</td><td>-</td><td>草稿</td><td><span class="status">草稿</span></td><td><button class="btn">继续编辑</button></td></tr></tbody></table>`}
    function opsTable(){return `<table><thead><tr><th>顾问</th><th>信用</th><th>绑定老师</th><th>进行中</th><th>电话模式</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td>李老师</td><td>12</td><td>18 / 无限</td><td>24 / 无限</td><td>隐私号</td><td><span class="status green">正常</span></td><td><button class="btn" data-go="ops-detail">查看</button></td></tr><tr><td>周老师</td><td>8</td><td>12 / 20</td><td>46 / 50</td><td>真实电话</td><td><span class="status amber">关注</span></td><td><button class="btn">查看</button></td></tr></tbody></table>`}
    function auditTable(){return `<table><thead><tr><th>时间</th><th>对象</th><th>变更</th><th>前值</th><th>后值</th><th>操作人</th><th>原因</th></tr></thead><tbody><tr><td>07-16 10:20</td><td>前台评分</td><td>调整</td><td>4.8</td><td>4.9</td><td>运营王</td><td>季度校准</td></tr><tr><td>07-15 16:08</td><td>电话模式</td><td>切换</td><td>隐私号</td><td>真实电话</td><td>运营赵</td><td>顾问授权</td></tr></tbody></table>`}
    function retentionTable(p){return `<table><thead><tr><th>记录</th><th>渠道</th><th>顾问</th><th>家长</th><th>服务单</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td>${p==='calls'?'CALL90001':'MSG90001'}</td><td>${p==='calls'?'双向隐私号':'企业微信'}</td><td>李老师</td><td>王女士</td><td>SC40001</td><td><span class="status ${p==='gap'?'red':'green'}">${p==='gap'?'录音失败':'已归档'}</span></td><td><button class="btn" data-go="evidence">查看</button></td></tr></tbody></table>`}
    function openModal(id){const m=popupMap[id];if(!m)return;activeModal=id;$('#modalTitle').textContent=m.title;$('#modalBody').innerHTML=m.body+`<div class="note" style="margin-top:12px"><h3>确认后结果</h3><p>${m.result}</p></div>`;$('#modal').classList.add('open')}
    function closeModal(){$('#modal').classList.remove('open');activeModal=null}
    function confirmModal(){if(!activeModal)return;const result=popupMap[activeModal].result;closeModal();showToast(result)}
    function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
    init();
  </script>
