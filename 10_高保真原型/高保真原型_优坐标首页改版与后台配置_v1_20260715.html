<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>优坐标首页改版与后台配置 v1</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #738197;
      --line: #dde7f2;
      --panel: #ffffff;
      --canvas: #f2f6fb;
      --blue: #2675ed;
      --blue-deep: #1554c3;
      --blue-soft: #eaf3ff;
      --cyan: #dff6ff;
      --green: #18a978;
      --green-soft: #e8f8f1;
      --orange: #ff841f;
      --orange-soft: #fff1df;
      --red: #dc4b62;
      --red-soft: #fff0f2;
      --yellow: #fff8cf;
      --yellow-line: #e3c94f;
      --shadow: 0 14px 35px rgba(47, 75, 112, .10);
      --radius: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; color: var(--ink); background: var(--canvas); font-size: 14px; letter-spacing: 0; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; display: grid; grid-template-rows: 64px 1fr; }
    .topbar { background: #172337; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 220px; }
    .brand-mark { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(135deg, #4b9eff, #2e63db); color: #fff; font-weight: 900; }
    .brand-title { font-weight: 900; font-size: 16px; }
    .brand-sub { margin-left: 8px; color: #aebbd0; font-size: 12px; font-weight: 600; }
    .surface-switch { display: flex; align-items: center; gap: 5px; padding: 4px; border-radius: 8px; background: rgba(255,255,255,.08); }
    .surface-switch button { border: 0; border-radius: 6px; padding: 8px 13px; color: #b9c5d7; background: transparent; }
    .surface-switch button.active { color: #fff; background: #2a73e8; font-weight: 800; }
    .user { display: flex; align-items: center; gap: 10px; color: #cbd5e1; white-space: nowrap; }
    .avatar { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: #d9e8ff; color: #2362c8; font-weight: 900; }
    .shell { display: grid; grid-template-columns: 238px minmax(680px, 1fr) 310px; min-height: calc(100vh - 64px); }
    .sidebar { position: relative; z-index: 21; padding: 18px 14px; background: #f8fbff; border-right: 1px solid var(--line); }
    .side-heading { padding: 4px 9px 16px; border-bottom: 1px solid var(--line); }
    .side-title { font-weight: 900; }
    .side-note { color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 5px; }
    .nav-group { margin-top: 18px; }
    .nav-label { padding: 0 9px 7px; color: #8c9aaf; font-size: 11px; font-weight: 900; letter-spacing: .08em; }
    .nav-item { width: 100%; border: 0; border-radius: 8px; background: transparent; color: #4f6077; padding: 10px 11px; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .nav-item:hover { background: #eef5ff; color: var(--blue); }
    .nav-item.active { background: var(--blue-soft); color: var(--blue-deep); font-weight: 900; }
    .nav-item small { color: #9ba8ba; font-size: 11px; }
    .nav-item.active small { color: var(--blue); }
    .nav-child { margin: 2px 0 4px 20px; border-left: 1px dashed #cbd8e7; padding-left: 8px; }
    .nav-child .nav-item { font-size: 12px; padding: 8px 9px; }
    .main { padding: 22px; min-width: 0; overflow: auto; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 16px; }
    .eyebrow { color: var(--blue); font-size: 12px; font-weight: 900; letter-spacing: .08em; }
    h1, h2, h3, p { margin: 0; }
    h1 { margin-top: 4px; font-size: 24px; letter-spacing: -.02em; }
    .page-sub { margin-top: 7px; color: var(--muted); line-height: 1.55; }
    .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .btn { min-height: 36px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink); padding: 8px 12px; font-weight: 700; }
    .btn:hover { border-color: #9cbbe8; background: #f9fcff; }
    .btn.primary { border-color: var(--blue); background: var(--blue); color: #fff; }
    .btn.primary:hover { background: var(--blue-deep); }
    .btn.ghost { color: var(--blue); border-color: #b9d4fb; background: var(--blue-soft); }
    .btn.warn { color: #9b5300; border-color: #ffd092; background: var(--orange-soft); }
    .btn.danger { color: var(--red); border-color: #ffc2ca; background: var(--red-soft); }
    .btn:disabled { cursor: not-allowed; opacity: .45; }
    .status-strip { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 13px; border: 1px solid #c8ddfa; border-radius: var(--radius); background: #f4f9ff; margin-bottom: 16px; }
    .status-left { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .status-pill, .tag { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 4px 9px; font-size: 12px; font-weight: 800; white-space: nowrap; }
    .status-pill.draft, .tag.blue { color: #1e5bbf; background: var(--blue-soft); }
    .status-pill.published, .tag.green { color: #11784f; background: var(--green-soft); }
    .status-pill.error, .tag.red { color: #b52b42; background: var(--red-soft); }
    .status-note { color: var(--muted); font-size: 12px; }
    .workspace { display: grid; grid-template-columns: minmax(420px, 1fr) 300px; gap: 16px; align-items: start; }
    .panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); overflow: hidden; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 17px; border-bottom: 1px solid var(--line); }
    .panel-title { font-size: 15px; font-weight: 900; }
    .panel-meta { color: var(--muted); font-size: 12px; }
    .panel-body { padding: 15px 17px; }
    .module-list { display: grid; gap: 10px; }
    .module-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 13px; border: 1px solid var(--line); border-radius: 9px; background: #fff; transition: border-color .18s, background .18s; }
    .module-row:hover, .module-row.selected { border-color: #a4c5f3; background: #fafdff; }
    .module-icon { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; color: #fff; font-size: 18px; font-weight: 900; }
    .module-icon.blue { background: linear-gradient(135deg, #3e9bff, #2268da); }
    .module-icon.green { background: linear-gradient(135deg, #58dba5, #15a36f); }
    .module-icon.orange { background: linear-gradient(135deg, #ffb54e, #f37d1d); }
    .module-icon.purple { background: linear-gradient(135deg, #ac9aff, #6d61de); }
    .module-icon.pink { background: linear-gradient(135deg, #ff9ab3, #ed5f80); }
    .module-info { min-width: 0; }
    .module-name { font-weight: 900; }
    .module-state { display: flex; align-items: center; gap: 7px; margin-top: 6px; }
    .module-actions { display: flex; align-items: center; gap: 6px; }
    .icon-button { width: 30px; height: 30px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: #7b8ca4; display: grid; place-items: center; font-weight: 900; }
    .icon-button:hover { border-color: #c8d9ee; background: #f4f8fe; color: var(--blue); }
    .icon-button.delete:hover { color: var(--red); background: var(--red-soft); border-color: #ffcbd2; }
    .switch { width: 36px; height: 20px; border: 0; border-radius: 999px; background: #bdc9d7; padding: 2px; display: flex; align-items: center; transition: background .18s; }
    .switch span { width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.16); transition: transform .18s; }
    .switch.on { background: var(--green); }
    .switch.on span { transform: translateX(16px); }
    .preview-card { position: sticky; top: 18px; }
    .preview-toolbar { display: flex; align-items: center; gap: 5px; padding: 11px 13px; border-bottom: 1px solid var(--line); background: #fbfdff; }
    .preview-toolbar button { border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 6px; padding: 6px 9px; font-size: 12px; }
    .preview-toolbar button.active { color: var(--blue-deep); border-color: #a9c9f7; background: var(--blue-soft); font-weight: 900; }
    .phone-wrap { padding: 18px 16px 22px; background: #eaf0f7; display: grid; place-items: center; }
    .phone { width: 278px; height: 600px; overflow: hidden; border: 7px solid #131b2b; border-radius: 28px; background: #e9f5ff; box-shadow: 0 18px 36px rgba(21, 42, 75, .22); }
    .phone-status { height: 25px; display: flex; justify-content: space-between; align-items: end; padding: 0 12px 2px; background: #fff; font-size: 9px; font-weight: 900; }
    .phone-screen { height: calc(100% - 25px - 48px); overflow: auto; padding: 8px 8px 12px; background: linear-gradient(180deg, #eaf6ff 0%, #f6fbff 80%); }
    .phone-nav { display: flex; align-items: center; justify-content: space-between; height: 27px; padding: 0 4px; }
    .phone-location { font-weight: 900; font-size: 12px; }
    .phone-menu { border: 1px solid rgba(25,48,75,.14); border-radius: 999px; background: rgba(255,255,255,.86); padding: 3px 8px; font-size: 10px; font-weight: 900; }
    .home-section { margin-top: 8px; border-radius: 12px; background: #fff; box-shadow: 0 3px 11px rgba(36, 86, 143, .08); overflow: hidden; }
    .home-banner { min-height: 108px; position: relative; padding: 15px 11px; overflow: hidden; color: #fff; background: linear-gradient(135deg, #bce1ff 0%, #eaf5ff 48%, #8bc5ff 100%); }
    .home-banner::after { content: ""; position: absolute; right: -12px; bottom: -15px; width: 132px; height: 100px; border-radius: 55% 45% 0 0; background: linear-gradient(160deg, #f5fbff, #72aff2); opacity: .9; transform: rotate(-8deg); }
    .home-banner .banner-copy { position: relative; z-index: 1; max-width: 165px; color: #0871e8; }
    .home-banner strong { display: block; font-size: 20px; line-height: 1.08; letter-spacing: -.03em; }
    .home-banner small { display: block; margin-top: 5px; color: #fff; font-size: 10px; font-weight: 800; }
    .home-banner em { display: inline-block; margin-top: 7px; border-radius: 999px; background: var(--orange); color: #fff; padding: 4px 9px; font-style: normal; font-size: 10px; font-weight: 900; }
    .quick-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px 3px; padding: 12px 6px 13px; }
    .quick { border: 0; background: transparent; color: #4d5664; padding: 0; font-size: 9px; white-space: nowrap; }
    .quick span { width: 32px; height: 32px; margin: 0 auto 4px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 900; }
    .quick:nth-child(5n+1) span { color: #2675ed; background: #e8f2ff; }
    .quick:nth-child(5n+2) span { color: #16aa73; background: #e4faef; }
    .quick:nth-child(5n+3) span { color: #9b6ee8; background: #f1eaff; }
    .quick:nth-child(5n+4) span { color: #f06c89; background: #fff0f4; }
    .quick:nth-child(5n+5) span { color: #ef9224; background: #fff5e8; }
    .section-title { display: flex; align-items: center; justify-content: space-between; padding: 10px 11px 7px; font-size: 13px; font-weight: 900; }
    .section-title a { color: #98a1ad; font-size: 10px; font-weight: 700; }
    .trial-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; padding: 0 8px 9px; }
    .trial { min-height: 58px; padding: 9px; border-radius: 9px; color: #fff; overflow: hidden; position: relative; }
    .trial.large { grid-row: span 2; min-height: 123px; background: linear-gradient(135deg, #68a7ff, #2e7ce7); }
    .trial.green { background: linear-gradient(135deg, #78dfba, #3dc59a); }
    .trial.orange { background: linear-gradient(135deg, #ffc45a, #ff9a1d); }
    .trial b { display: block; font-size: 12px; }
    .trial small { display: block; margin-top: 5px; font-size: 9px; opacity: .86; line-height: 1.3; }
    .teacher-tabs { display: flex; gap: 5px; padding: 0 8px 8px; }
    .teacher-tab { flex: 1; border: 1px solid #e2ebf6; border-radius: 8px; padding: 7px 3px; color: #41516a; background: #f8fbff; font-size: 9px; font-weight: 900; }
    .teacher-tab.active { color: #fff; border-color: #5e97ef; background: #6099f1; }
    .teacher-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 8px 10px; }
    .teacher-card { overflow: hidden; border-radius: 8px; background: #fff; border: 1px solid #e9eef5; }
    .teacher-photo { height: 72px; background: linear-gradient(135deg, #dceaff, #b9cae6); display: grid; place-items: end center; overflow: hidden; }
    .teacher-photo img { width: 100%; height: 100%; object-fit: cover; }
    .teacher-info { padding: 6px; }
    .teacher-info b { display: block; font-size: 10px; }
    .teacher-info small { display: block; color: #7d8b9e; margin-top: 3px; font-size: 8px; white-space: nowrap; }
    .course-list { display: grid; gap: 7px; padding: 0 8px 10px; }
    .course { display: grid; grid-template-columns: 65px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px; border: 1px solid #edf1f6; border-radius: 8px; background: #fff; }
    .cover { width: 65px; height: 52px; border-radius: 7px; display: grid; place-items: center; color: #fff; text-align: center; font-size: 10px; font-weight: 900; background: linear-gradient(135deg, #2e82f4, #77b4ff); }
    .cover.green { background: linear-gradient(135deg, #22be89, #85e2b8); }
    .cover.orange { background: linear-gradient(135deg, #ff9b21, #ffd064); }
    .course b { display: block; font-size: 10px; line-height: 1.3; }
    .course small { display: block; color: #8a96a6; margin-top: 4px; font-size: 8px; }
    .price { color: var(--orange); font-size: 12px; font-weight: 900; white-space: nowrap; }
    .follow { display: flex; align-items: center; justify-content: space-between; padding: 10px; }
    .follow-copy b { display: block; font-size: 11px; }
    .follow-copy small { display: block; margin-top: 3px; color: #99a3b0; font-size: 8px; }
    .follow button { border: 1px solid #72a9fb; border-radius: 999px; color: #2675ed; background: #fff; padding: 5px 9px; font-size: 9px; font-weight: 900; }
    .home-empty { padding: 18px 12px; color: #95a1b1; text-align: center; font-size: 11px; }
    .phone-tabbar { height: 48px; border-top: 1px solid #e3e9f1; background: #fff; display: grid; grid-template-columns: repeat(5, 1fr); }
    .phone-tabbar button { border: 0; background: transparent; color: #7c8795; font-size: 8px; font-weight: 800; padding: 5px 0; }
    .phone-tabbar button strong { display: block; margin-bottom: 2px; font-size: 14px; }
    .phone-tabbar button.active { color: #2675ed; }
    .notes { position: relative; z-index: 21; padding: 22px 14px; border-left: 1px solid var(--line); background: #fffdf0; overflow: auto; }
    .notes-title { font-size: 14px; font-weight: 900; }
    .notes-sub { margin-top: 5px; color: #8c7c3f; font-size: 12px; line-height: 1.45; }
    .note { margin-top: 13px; padding: 11px 12px; border: 1px solid var(--yellow-line); border-radius: 8px; background: var(--yellow); color: #594d1c; line-height: 1.55; font-size: 12px; }
    .note b { display: block; margin-bottom: 4px; color: #42370c; }
    .note ul { margin: 5px 0 0 17px; padding: 0; }
    .home-view { min-height: calc(100vh - 64px); display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% -10%, #e2f2ff, #f4f7fb 55%); }
    .home-view-inner { width: min(1080px, 100%); display: grid; grid-template-columns: 1fr 320px; align-items: start; gap: 30px; }
    .home-intro { padding: 34px 8px; }
    .home-intro .eyebrow { color: var(--orange); }
    .home-intro h1 { max-width: 540px; font-size: 36px; line-height: 1.18; }
    .home-intro p { max-width: 480px; margin-top: 12px; color: var(--muted); line-height: 1.7; }
    .home-intro .home-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
    .home-intro .mini-status { margin-top: 20px; color: #7d8b9e; font-size: 12px; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; padding: 20px 330px 20px 258px; background: rgba(17, 29, 49, .45); }
    .modal-backdrop.open { display: grid; }
    .modal { position: relative; z-index: 1; width: min(620px, 100%); max-height: min(760px, calc(100vh - 40px)); overflow: auto; border-radius: 12px; background: #fff; box-shadow: 0 24px 70px rgba(12, 25, 46, .28); }
    .modal.banner-modal { width: min(920px, 100%); max-height: min(840px, calc(100vh - 40px)); }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { font-size: 18px; }
    .modal-head p { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .close { width: 30px; height: 30px; border: 0; border-radius: 6px; background: #f2f6fb; color: #738197; font-size: 18px; }
    .form { display: grid; gap: 14px; padding: 18px 20px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #46566d; font-size: 12px; font-weight: 900; }
    .field input, .field select, .field textarea { width: 100%; min-height: 38px; border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; color: var(--ink); background: #fff; }
    .field textarea { min-height: 78px; resize: vertical; }
    .field-help { color: #9aa6b6; font-size: 11px; line-height: 1.45; }
    .form-preview { min-height: 86px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 900; background: linear-gradient(135deg, #4ba4ff, #215ccf); }
    .banner-carousel { padding: 20px 28px 10px; background: #fff; }
    .banner-carousel-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; color: #333b48; font-size: 15px; font-weight: 900; }
    .banner-carousel-head small { color: #9aa2ac; font-size: 11px; font-weight: 500; }
    .banner-carousel-list { display: grid; gap: 12px; }
    .banner-carousel-item { display: grid; grid-template-columns: 172px minmax(0, 1fr) 48px; align-items: start; gap: 18px; padding: 14px; border: 1px solid #e3e6ea; background: #fff; }
    .banner-upload { width: 172px; height: 116px; border: 1px dashed #c7cdd5; display: grid; place-items: center; align-content: center; gap: 6px; color: #9098a4; background: #fafbfc; cursor: pointer; }
    .banner-upload strong { color: #747e8b; font-size: 13px; font-weight: 700; }
    .banner-upload span { font-size: 11px; }
    .banner-upload.red { background: linear-gradient(135deg, #fff5f4, #fffafa); }
    .banner-upload.orange { background: linear-gradient(135deg, #fff9ed, #fffdf8); }
    .banner-upload.pink { background: linear-gradient(135deg, #fff4f7, #fffafe); }
    .banner-item-fields { display: grid; gap: 12px; min-width: 0; }
    .banner-item-field { display: grid; grid-template-columns: 72px minmax(0, 1fr); align-items: center; gap: 10px; }
    .banner-item-field label { color: #555e6a; font-size: 12px; white-space: nowrap; }
    .banner-item-field input { width: 100%; min-height: 34px; border: 1px solid #d7dce2; border-radius: 2px; padding: 7px 9px; color: var(--ink); background: #fff; font-size: 12px; }
    .banner-item-field input:focus { border-color: #4b93e8; outline: 2px solid rgba(75,147,232,.12); }
    .banner-item-actions { display: flex; justify-content: flex-end; }
    .banner-item-actions button { border: 0; background: transparent; color: #e54848; font-size: 12px; cursor: pointer; }
    .banner-item-actions button:disabled { visibility: hidden; }
    .banner-size-hint { grid-column: 1 / -1; margin-top: -2px; color: #8d959e; font-size: 11px; }
    .banner-add { display: block; margin: 16px auto 8px; border: 1px solid #2f7de1; border-radius: 2px; padding: 8px 28px; color: #2f7de1; background: #fff; font-size: 12px; cursor: pointer; }
    .banner-add:hover { border-color: #9cbbe8; color: var(--blue); background: #f8fbff; }
    .quick-carousel-item { grid-template-columns: 84px minmax(0, 1fr) 48px; }
    .quick-icon-upload { width: 84px; height: 84px; border: 1px dashed #b8d7c7; display: grid; place-items: center; color: #269267; background: #effaf4; font-size: 22px; }
    .quick-item-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
    .quick-item-field { display: grid; gap: 5px; min-width: 0; }
    .quick-item-field.full { grid-column: 1 / -1; }
    .quick-item-field label { color: #555e6a; font-size: 12px; }
    .quick-item-field input { width: 100%; min-height: 34px; border: 1px solid #d7dce2; border-radius: 2px; padding: 7px 9px; color: var(--ink); background: #fff; font-size: 12px; }
    .bottom-config-list { display: grid; gap: 10px; }
    .bottom-config-item { display: grid; grid-template-columns: 48px minmax(0, 1fr) 84px; align-items: center; gap: 12px; padding: 12px; border: 1px solid #e3e6ea; background: #fff; }
    .bottom-config-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 8px; color: #2675ed; background: #eef5ff; font-size: 20px; }
    .bottom-config-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

      if (module.type === "teacher") return `<div class="trial-ad-title field"><label>主标题</label><input name="title" value="${escapeHtml(f.title)}" placeholder="例如：推荐老师"></div><div class="banner-carousel-head"><span>三位广告位</span><small>固定 3 个，不支持新增或删除</small></div><div class="trial-ad-list">${renderFixedAdEntries("teacher", "教师广告位")}</div><div class="field-help">广告位跳转到一级教师类型；一级类型启用、允许前台展示且配置完整时，才进入首页入口，二级类型不单独配置首页入口。</div>`;
      if (module.type === "courses") return `<div class="trial-ad-title field"><label>主标题</label><input name="title" value="${escapeHtml(f.title)}" placeholder="例如：精品课程"></div><div class="banner-carousel-head"><span>广告位</span><small>可无限新增课程广告位</small></div><div class="trial-ad-list">${renderCourseEntries()}</div><button type="button" class="banner-add" data-action="course-add">＋ 新增课程广告位</button><div class="field-help">广告位跳转到已有课程详情或课程列表；不限制广告位数量，真实课程选择、上下架和读取失败状态待数据接口确认。</div>`;
      if (module.type === "quick") return `<div class="banner-carousel"><div class="banner-carousel-head"><span>首页快捷入口</span><small>最少 4 个，最多 10 个</small></div><div class="banner-carousel-list">${renderQuickEntries()}</div><button type="button" class="banner-add" data-action="quick-add" ${state.quickEntries.length >= 10 ? "disabled" : ""}>＋ 新增入口</button></div>`;
      if (module.type === "bottom") return `<div class="banner-carousel-head"><span>底部导航配置</span><small>固定 5 个入口：首页、全部课程、全部老师、消息、我的</small></div>${renderBottomEntries()}<div class="field-help">每项可编辑前台展示标题、跳转页面和是否展示；首页默认选中且至少保留一个入口展示。</div>`;
      if (module.type === "wechat") return `<div class="form-preview" style="background:linear-gradient(135deg,#39c979,#11854c)">▣　公众号关注卡片预览</div><div class="quick-item-fields"><div class="quick-item-field"><label>主标题</label><input name="title" value="${escapeHtml(f.title)}" placeholder="填写前台展示主标题"></div><div class="quick-item-field"><label>副标题</label><input name="subtitle" value="${escapeHtml(f.subtitle)}" placeholder="填写前台展示副标题"></div><div class="quick-item-field"><label>按钮文案</label><input name="cta" value="${escapeHtml(f.cta)}" placeholder="例如：去关注"></div><div class="quick-item-field"><label>跳转链接</label><input name="url" value="${escapeHtml(f.url)}" placeholder="填写点击后的目标链接"></div><label class="bottom-visible"><input type="checkbox" name="visible" ${f.visible ? "checked" : ""}> 是否展示</label></div><div class="field-help">交互参考快捷入口配置；开启展示时，主标题、副标题、按钮文案和跳转链接均为必填。</div>`;
      return `<div class="form-grid">${common}<div class="field"><label>导航数量</label><input name="count" value="${module.count}" inputmode="numeric"></div><div class="field"><label>排序</label><input name="sort" value="1" inputmode="numeric"></div></div><div class="field-help">首页为固定默认选中项，不能关闭全部底部导航入口。</div>`;
    }
    function renderModal() {
      if (!state.modal) { modalRoot.innerHTML = ""; return; }
      const module = state.draft.find(item => item.id === state.modal.id);
      if (!module) { state.modal = null; modalRoot.innerHTML = ""; return; }
      const modalTitle = module.type === "banner" ? "首页轮播广告 banner" : module.type === "trial" ? "编辑39.9试听课" : module.type === "teacher" ? "编辑教师类型与教师推荐" : module.type === "courses" ? "编辑精品课程" : `编辑${escapeHtml(module.name)}`;
      const saveLabel = module.type === "banner" ? "保存，发布" : "保存";
      modalRoot.innerHTML = `<div class="modal-backdrop open" data-action="close-modal"><section class="modal ${module.type === "banner" || module.type === "trial" ? "banner-modal" : ""}" role="dialog" aria-modal="true" aria-label="${modalTitle}" data-modal="true"><div class="modal-head"><div><h2>${modalTitle}</h2><p>保存后进入草稿，不会立即影响家长端首页。</p></div><button class="close" data-action="close-modal" aria-label="关闭">×</button></div><form class="form" data-form="${module.id}">${formFields(module)}</form><div class="modal-foot"><button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-modal" data-id="${module.id}">${saveLabel}</button></div></section></div>`;
    }
    function render() { app.innerHTML = state.surface === "workbench" ? renderWorkbench() : renderHome(); renderModal(); }
    function saveForm(id) {
      const module = state.draft.find(item => item.id === id);
      const form = document.querySelector(`[data-form="${id}"]`);
      if (!module || !form) return;
      const data = new FormData(form);
      const title = String(data.get("title") || "").trim();
      if (!["banner", "quick", "bottom"].includes(module.type) && !title) { showToast("主标题不能为空", "error"); return; }
      if (module.type === "banner") {
        form.querySelectorAll("[data-banner-field]").forEach(input => {
          const item = state.bannerItems.find(entry => entry.id === input.dataset.bannerId);
          if (item) item[input.dataset.bannerField] = input.dataset.bannerField === "duration" ? Math.max(1, Number(input.value) || 1) : input.value.trim();
        });
        const bannerIssue = getBannerValidationMessage();
        if (bannerIssue) { showToast(bannerIssue, "error"); return; }
      }
      if (module.type === "quick") {
        form.querySelectorAll("[data-quick-field]").forEach(input => {
          const item = state.quickEntries.find(entry => entry.id === input.dataset.quickId);
          if (item) item[input.dataset.quickField] = input.value.trim();
        });
        const quickIssue = getQuickValidationMessage();
        if (quickIssue) { showToast(quickIssue, "error"); return; }
        module.count = state.quickEntries.length;
      }
      if (module.type === "trial") {
        form.querySelectorAll("[data-trial-field]").forEach(input => {
          const item = state.trialEntries.find(entry => entry.id === input.dataset.trialId);
          if (item) item[input.dataset.trialField] = input.value.trim();
        });
        const trialIssue = getTrialValidationMessage(title);
        if (trialIssue) { showToast(trialIssue, "error"); return; }
        module.count = 3;
      }
      if (module.type === "bottom") {
        form.querySelectorAll("[data-bottom-field]").forEach(input => {
          const item = state.bottomItems.find(entry => entry.id === input.dataset.bottomId);
          if (!item) return;
          item[input.dataset.bottomField] = input.type === "checkbox" ? input.checked : input.value.trim();
        });
        const bottomIssue = getBottomValidationMessage();
        if (bottomIssue) { showToast(bottomIssue, "error"); return; }
        module.count = state.bottomItems.filter(item => item.visible).length;
      }
      if (module.type === "wechat") {
        ["title", "subtitle", "cta", "url"].forEach(key => { module.fields[key] = String(data.get(key) || "").trim(); });
        module.fields.visible = data.get("visible") === "on";
        const wechatIssue = getWechatValidation(module.fields);
        if (wechatIssue) { showToast(wechatIssue, "error"); return; }
        module.enabled = module.fields.visible;
      }
      if (module.type === "teacher" || module.type === "courses") {
        const adType = module.type === "teacher" ? "teacher" : "course";
        form.querySelectorAll("[data-ad-field]").forEach(input => {
          const item = state[`${adType}Entries`].find(entry => entry.id === input.dataset.adId);
          if (item) item[input.dataset.adField] = input.value.trim();
        });
        const adIssue = module.type === "courses" ? getCourseValidation(title, module.name) : getFixedAdValidation(adType, title, module.name);
        if (adIssue) { showToast(adIssue, "error"); return; }
        module.count = module.type === "courses" ? state.courseEntries.length : 3;
      }
      ["title", "subtitle", "cta", "target", "schedule"].forEach(key => { if (data.has(key)) module.fields[key] = String(data.get(key)); });
      if (data.has("count")) module.count = Math.max(1, Number(data.get("count")) || 1);
      if (module.type === "banner") module.count = state.bannerItems.length;
      module.summary = `${module.fields.title} · ${module.fields.subtitle || module.fields.target}`;
      module.updated = "刚刚保存";
      state.modal = null;
      render();
      showToast(`${module.name}已保存到草稿`, "success");
    }
    function getQuickValidationMessage() {
      if (state.quickEntries.length < 4) return "快捷入口最少保留 4 个";
      if (state.quickEntries.length > 10) return "快捷入口最多配置 10 个";
      const incomplete = state.quickEntries.some(item => !item.name || !item.target || !item.url);
      return incomplete ? "快捷入口配置不完整：请填写名称、跳转目标和地址" : "";
    }
    function getTrialValidationMessage(title = "") {
      if (!String(title).trim()) return "39.9 试听课主标题不能为空";
      if (state.trialEntries.length !== 3) return "39.9 试听课必须保留三个广告位";
      const incomplete = state.trialEntries.some(item => !item.imageText || !item.target || !item.url);
      return incomplete ? "39.9 试听课配置不完整：请补齐三个广告位的图片、跳转目标和地址" : "";
    }
    function getFixedAdValidation(type, title, name) {
      if (!String(title).trim()) return `${name}主标题不能为空`;
      const entries = state[`${type}Entries`];
      if (entries.length !== 3) return `${name}必须保留三个广告位`;
      return entries.some(item => !item.imageText || !item.target || !item.url) ? `${name}配置不完整：请补齐三个广告位的图片、跳转目标和地址` : "";
    }
    function getCourseValidation(title, name) {
      if (!String(title).trim()) return `${name}主标题不能为空`;
      if (!state.courseEntries.length) return `${name}至少保留一个广告位`;
      return state.courseEntries.some(item => !item.imageText || !item.target || !item.url) ? `${name}配置不完整：请补齐课程广告位的图片、跳转目标和地址` : "";
    }
    function getBottomValidationMessage() {
      if (!state.bottomItems.some(item => item.visible)) return "底部导航至少保留一个展示入口";
      const home = state.bottomItems.find(item => item.id === "bottom-home");
      if (!home?.visible) return "首页入口必须保持展示";
      return state.bottomItems.some(item => item.visible && (!item.title || !item.target)) ? "底部导航配置不完整：请填写展示标题和跳转页面" : "";
    }
    function getWechatValidation(fields) {
      if (!fields.visible) return "";
      return ["title", "subtitle", "cta", "url"].some(key => !String(fields[key] || "").trim()) ? "公众号关注配置不完整：请填写主标题、副标题、按钮文案和跳转链接" : "";
    }
    function getBannerValidationMessage() {
      if (!state.bannerItems.length) return "Banner 至少保留一条轮播图";
      const incomplete = state.bannerItems.find(item => !item.imageText || !item.target || !item.url || !Number.isInteger(Number(item.duration)) || Number(item.duration) < 1);
      return incomplete ? "Banner 配置不完整：请填写图片、跳转目标、地址和正整数轮播时长" : "";
    }
    function publish(fail = false) {
      if (fail) { showToast("发布失败：示例服务响应超时，请稍后重试", "error"); return; }
      const invalid = state.draft.some(item => item.enabled && !item.fields.title);
      if (invalid) { showToast("发布失败：存在配置不完整的模块", "error"); return; }
      const banner = state.draft.find(item => item.type === "banner" && item.enabled);
      const bannerIssue = banner ? getBannerValidationMessage() : "";
      if (bannerIssue) { showToast(`发布失败：${bannerIssue.replace("Banner ", "")}`, "error"); return; }
      const quick = state.draft.find(item => item.type === "quick" && item.enabled);
      const quickIssue = quick ? getQuickValidationMessage() : "";
      if (quickIssue) { showToast(`发布失败：${quickIssue}`, "error"); return; }
      const trial = state.draft.find(item => item.type === "trial" && item.enabled);
      const trialIssue = trial ? getTrialValidationMessage(trial.fields.title) : "";
      if (trialIssue) { showToast(`发布失败：${trialIssue}`, "error"); return; }
      const teacher = state.draft.find(item => item.type === "teacher" && item.enabled);
      const teacherIssue = teacher ? getFixedAdValidation("teacher", teacher.fields.title, teacher.name) : "";
      if (teacherIssue) { showToast(`发布失败：${teacherIssue}`, "error"); return; }
      const courses = state.draft.find(item => item.type === "courses" && item.enabled);
      const courseIssue = courses ? getCourseValidation(courses.fields.title, courses.name) : "";
      if (courseIssue) { showToast(`发布失败：${courseIssue}`, "error"); return; }
      const bottom = state.draft.find(item => item.type === "bottom" && item.enabled);
      const bottomIssue = bottom ? getBottomValidationMessage() : "";
      if (bottomIssue) { showToast(`发布失败：${bottomIssue}`, "error"); return; }
      const wechat = state.draft.find(item => item.type === "wechat" && item.enabled);
      const wechatIssue = wechat ? getWechatValidation(wechat.fields) : "";
      if (wechatIssue) { showToast(`发布失败：${wechatIssue}`, "error"); return; }
      state.published = structuredClone(state.draft);
      state.lastPublish = new Date().toLocaleString("zh-CN", { hour12: false }).replaceAll("/", "-");
      state.previewMode = "published";
      render();
      showToast("首页已发布，家长端读取新版本", "success");
    }
    function handleAction(action, el) {
      const id = el.dataset.id;
      if (action === "surface") { state.surface = el.dataset.value; render(); return; }
      if (action === "select-module") { state.activeModule = id; state.surface = "workbench"; state.modal = id ? { id } : null; render(); return; }
      if (action === "view-home") { state.surface = "home"; state.homeMode = "published"; render(); return; }
      if (action === "view-workbench") { state.surface = "workbench"; render(); return; }
      if (action === "preview-draft") { state.surface = "workbench"; state.previewMode = "draft"; render(); showToast("手机预览已切换为草稿版本"); return; }
      if (action === "preview-mode") { state.previewMode = el.dataset.value; render(); return; }
      if (action === "toggle") { const module = state.draft.find(item => item.id === id); if (module) { module.enabled = !module.enabled; state.activeModule = id; render(); showToast(`${module.name}已${module.enabled ? "启用" : "停用"}`, module.enabled ? "success" : ""); } return; }
      if (action === "edit") { state.modal = { id }; render(); return; }
      if (action === "close-modal") { if (el.dataset.action === "close-modal" && el.closest("[data-modal]") && el.tagName !== "BUTTON") return; state.modal = null; render(); return; }
      if (action === "save-modal") { saveForm(id); return; }
      if (action === "banner-delete") { if (state.bannerItems.length <= 1) { showToast("至少保留一张轮播图", "error"); return; } state.bannerItems = state.bannerItems.filter(item => item.id !== id); render(); showToast("轮播图已从草稿中移除"); return; }
      if (action === "banner-upload") {
        const item = state.bannerItems.find(entry => entry.id === id);
        if (!item) return;
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "image/png,image/jpeg";
        input.onchange = () => {
          const file = input.files?.[0];
          if (!file) return;
          if (!/^image\/(png|jpeg)$/.test(file.type)) { showToast("仅支持 jpg/png 图片", "error"); return; }
          if (file.size > 2 * 1024 * 1024) { showToast("图片不能超过 2MB", "error"); return; }
          item.imageText = file.name;
          render();
          showToast("图片已加入草稿，保存后生效", "success");
        };
        input.click();
        return;
      }
      if (action === "trial-upload") {
        const item = state.trialEntries.find(entry => entry.id === id);
        if (!item) return;
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "image/png,image/jpeg";
        input.onchange = () => {
          const file = input.files?.[0];
          if (!file) return;
          if (!/^image\/(png|jpeg)$/.test(file.type)) { showToast("仅支持 jpg/png 图片", "error"); return; }
          if (file.size > 2 * 1024 * 1024) { showToast("图片不能超过 2MB", "error"); return; }
          item.imageText = file.name;
          render();
          showToast("试听课广告图片已加入草稿，保存后生效", "success");
        };
        input.click();
        return;
      }
      if (action === "content-ad-upload") {
        const type = el.dataset.adType;
        const item = state[`${type}Entries`]?.find(entry => entry.id === id);
        if (!item) return;
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "image/png,image/jpeg";
        input.onchange = () => {
          const file = input.files?.[0];
          if (!file) return;
          if (!/^image\/(png|jpeg)$/.test(file.type)) { showToast("仅支持 jpg/png 图片", "error"); return; }
          if (file.size > 2 * 1024 * 1024) { showToast("图片不能超过 2MB", "error"); return; }
          item.imageText = file.name;
          render();
          showToast("广告图片已加入草稿，保存后生效", "success");
        };
        input.click();
        return;
      }
      if (action === "course-add") {
        const next = state.courseEntries.length + 1;
        state.courseEntries = [...state.courseEntries, { id: `course-${Date.now()}`, tone: next % 3 === 0 ? "orange" : next % 2 === 0 ? "green" : "blue", imageText: `课程广告图片 ${next}`, target: "课程详情", url: "" }];
        render();
        showToast("已添加课程广告位到草稿", "success");
        return;
      }
      if (action === "course-delete") {
        if (state.courseEntries.length <= 1) { showToast("至少保留一个课程广告位", "error"); return; }
        state.courseEntries = state.courseEntries.filter(entry => entry.id !== id);
        render();
        showToast("课程广告位已从草稿中移除");
        return;
      }
      if (action === "banner-add") { const next = state.bannerItems.length + 1; state.bannerItems = [...state.bannerItems, { id: `banner-${Date.now()}`, tone: next % 2 ? "pink" : "red", imageText: `示例图片 ${next}`, target: "课程详情", url: "这里填写跳转地址（具体地址开发要）", duration: 3 }]; render(); showToast("已添加轮播配置到草稿", "success"); return; }
      if (action === "quick-delete") { if (state.quickEntries.length <= 4) { showToast("快捷入口最少保留 4 个", "error"); return; } state.quickEntries = state.quickEntries.filter(item => item.id !== id); const quick = state.draft.find(item => item.type === "quick"); if (quick) quick.count = state.quickEntries.length; render(); showToast("快捷入口已从草稿中移除"); return; }
      if (action === "quick-add") { if (state.quickEntries.length >= 10) { showToast("快捷入口最多配置 10 个", "error"); return; } const next = state.quickEntries.length + 1; state.quickEntries = [...state.quickEntries, { id: `quick-${Date.now()}`, icon: "＋", name: `新快捷入口 ${next}`, target: "待配置页面", url: "" }]; const quick = state.draft.find(item => item.type === "quick"); if (quick) quick.count = state.quickEntries.length; render(); showToast("已添加快捷入口到草稿", "success"); return; }
      if (action === "quick-icon-upload") {
        const item = state.quickEntries.find(entry => entry.id === id);
        if (!item) return;
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "image/png,image/jpeg";
        input.onchange = () => {
          const file = input.files?.[0];
          if (!file) return;
          if (!/^image\/(png|jpeg)$/.test(file.type)) { showToast("仅支持 jpg/png Icon 图片", "error"); return; }
          if (file.size > 2 * 1024 * 1024) { showToast("Icon 图片不能超过 2MB", "error"); return; }
          item.icon = file.name;
          render();
          showToast("Icon 已加入草稿，保存后生效", "success");
        };
        input.click();
        return;
      }
      if (action === "delete") { const module = state.draft.find(item => item.id === id); if (module && confirm(`确定删除“${module.name}”吗？删除只作用于当前草稿。`)) { state.draft = state.draft.filter(item => item.id !== id); state.activeModule = state.draft[0]?.id || ""; render(); showToast(`${module.name}已从草稿中删除`); } return; }
      if (action === "publish") { publish(false); return; }
      if (action === "related") { showToast("将进入现有维护模块，规则与首页读取保持一致"); return; }
      if (action === "home-refresh") { render(); showToast("已重新读取已发布首页", "success"); return; }
      if (action === "home-click") { showToast(`已触发“${el.dataset.label || "首页入口"}”操作`); return; }
    }
    document.addEventListener("click", event => {
      const target = event.target.closest("[data-action]");
      if (!target) return;
      if (target.dataset.action === "select-module" && target.closest(".module-row")) event.stopPropagation();
      handleAction(target.dataset.action, target);
    });
    document.addEventListener("keydown", event => { if (event.key === "Escape" && state.modal) { state.modal = null; render(); } });
    render();
  </script>
</body>
</html>
